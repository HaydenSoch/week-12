<!doctype html>

<head>
<meta charset="utf-8">
<title>ADSR Delay Voice</title>
<style>body{background:#fff;color:#000}</style>

  </head>
    <body>

<button id="trig" type="button">Play Note 1</button>

<p>
Delay time <input id="time" type="range" min="10" max="2000" value="300">
<br>
Feedback <input id="fb" type="range" min="0" max="95" value="70">
<br>


<button id="trig2" type="button">Play Note 2</button>
<br>
<input id = "Modulator1" type="range" min="0" max="1000" step="10" value="0.0"><label id="Modulator1">Modulator2</label>
<br>
<input id = "Index1" type="range" min="0" max="100" step="1" value="0.0"><label id="Index1">Index</label>
<br>
<input id = "FiltSpeed1" type="range" min="0" max="5" step="0.01" value="0.0"><label id="FiltSpeed1">FiltSpeed</label>
<br>
Delay Time 2 <input id="time2" type="range" min="10" max="2000" value="300">
<br>
Feedback 2 <input id="fb2" type="range" min="0" max="95" value="70">
<br>
</p>
<script>

const ctx = new AudioContext();

const master = new GainNode(ctx)
master.gain.value = 0.1;


const delay = new DelayNode(ctx, { maxDelayTime: 2.5})

delay.delayTime = 0.3

const feedback = new GainNode(ctx)
feedback.gain.value = 0.7;

const DelFilter = new BiquadFilterNode(ctx)
DelFilter.type = "bandpass"
DelFilter.frequency.value = 2000;


delay.connect(feedback);
feedback.connect(DelFilter);
DelFilter.connect(delay);


delay.connect(master);
master.connect(ctx.destination);

// Everything above is built once. The code below runs on every click
// and builds a brand new note each time.
function playNote(frequency, filterCutOff) 

{

  ctx.resume();

  // "Now" on the audio clock. All the timings below are offsets from this.
  const t = ctx.currentTime;


  const osc1 = new OscillatorNode(ctx)
  osc1.type = "square";
  osc1.frequency.value = frequency;

  const filter = new BiquadFilterNode(ctx);
  filter.type = "lowpass"
  filter.frequency.value = frequency * filterCutOff;
  filter.Q = 40

  const filterLFO = new OscillatorNode(ctx);
  filterLFO.type = "sine";
  filterLFO.frequency.value = 1;

  const LFOdepth = new GainNode(ctx);
  LFOdepth.gain.value = (frequency * filterCutOff) * 50

  filterLFO.connect(LFOdepth);
  LFOdepth.connect(filter.frequency);

  const dur = 0.15
  const env = new GainNode(ctx)
  env.gain.value = 0;

  env.gain.setValueAtTime(0, t);                     // start silent
  env.gain.linearRampToValueAtTime(1, t + dur*0.45);     // Attack
  env.gain.linearRampToValueAtTime(0.3, t + dur*0.5);    // Decay
  //env.gain.setValueAtTime(0.2, t + dur*0.9);             // Sustain
  env.gain.linearRampToValueAtTime(0, t + dur);      // Release

  osc1.connect(filter);
  filter.connect(env);
  env.connect(master);  // straight to the speakers (the "dry" sound)
  env.connect(delay);   // into the delay loop (the echoes, or "wet" sound)

  // Start the tone now, and stop it just after the release has finished.
  // A stopped node with nothing referring to it is cleaned up by the browser.
  osc1.start(t);
  filterLFO.start(t);
  osc1.stop(t + dur);
  filterLFO.stop(t + dur);
};


   // 1. Define the array of choices
        const midiPitches = [24, 25, 28, 29, 31, 32, 35, 36];

        // 2. Create the random picker function
        const randomPitch = function() {
            let randomMidiNote = midiPitches[Math.floor(Math.random() * midiPitches.length)];
            
            let newFreq = 440 * 2 ** ((randomMidiNote - 69) / 12);

            return newFreq;
        }

        const MultArray = [20, 40, 80, 160, 320]
        const filterFreq = function()
            {
                let filterMult = MultArray[Math.floor(Math.random() * MultArray.length)];
              

                return filterMult
                        }
    

document.querySelector("#trig").onclick = () => playNote(randomPitch(), filterFreq());
       

// Delay time slider
document.getElementById('time').addEventListener('input', function (e) {
  delay.delayTime.setTargetAtTime(e.target.value / 1000, ctx.currentTime, 0.05);
});

// Feedback slider.
document.getElementById('fb').addEventListener('input', function (e) {
  feedback.gain.setTargetAtTime(e.target.value / 100, ctx.currentTime, 0.02);
});



//FM Synth


let osc2, mod, filterMod
document.querySelector("#trig2").onclick = () =>

{
 
//Set up Frequency Modulation Tone
osc2 = new OscillatorNode(ctx);
osc2.frequency.value = 220;
osc2.type = "sine";

const osc2Gain = new GainNode(ctx);
osc2Gain.gain.value = 0.1;

const delay2 = new DelayNode(ctx, { maxDelayTime: 2.5})

delay2.delayTime = 0.3

const feedback2 = new GainNode(ctx)
feedback2.gain.value = 0.7;


mod = new OscillatorNode(ctx);
mod.type = "triangle"
mod.frequency.value = 55; // modulator value

const modulatorGain = new GainNode(ctx);
modulatorGain.gain.value = 4000; // Index or strength of harmonics

//Set up Oscillating Filter

const filter = new BiquadFilterNode(ctx);
filter.type = "lowpass";
filter.frequency.value = 1200;
filter.Q.value = 20;

filterMod = new OscillatorNode(ctx);
filterMod.frequency.value = 0.5;
filterMod.type = "sine";

const filterModGain = new GainNode(ctx);
filterModGain.gain.value = 1000

//ASDR
const dur2 = 1
const t = ctx.currentTime;
  const env2 = new GainNode(ctx)
  env2.gain.value = 0;

  env2.gain.setValueAtTime(0, t);                     // start silent
  env2.gain.linearRampToValueAtTime(1, t + dur2*1.2);     // Attack
  env2.gain.linearRampToValueAtTime(0.3, t + dur2*1.5);    // Decay
  env2.gain.setValueAtTime(0.2, t + dur2*2);             // Sustain
  env2.gain.linearRampToValueAtTime(0, t + dur2*2.1);      // Release


//connect everything up

filterMod.connect(filterModGain);
//filterModGain.connect(filter.frequency)
filterMod.connect(env2);

osc2.connect(osc2Gain);
osc2.connect(env2);


mod.connect(modulatorGain);
mod.connect(env2);

modulatorGain.connect(osc2.frequency);
osc2Gain.connect(env2);



osc2Gain.connect(filter);
filter.connect(delay2);
delay2.connect(ctx.destination);
delay2.connect(feedback2);
feedback2.connect(delay2);
env2.connect(ctx.destination);

const slider1 = document.querySelector("#Modulator1");
        slider1.addEventListener("input", () => {
            ctx.resume();
        modulatorGain.gain.value = Number(slider1.value);
        document.querySelector("Modulator1").textContent = slider1.value;

});

 const slider2 = document.querySelector("#Index1");
        slider2.addEventListener("input", () => {
            ctx.resume();
        mod.frequency.value = Number(slider2.value);
        document.querySelector("Index1").textContent = slider2.value;

});

 const slider3 = document.querySelector("#FiltSpeed1");
        slider3.addEventListener("input", () => {
            ctx.resume();
        filterMod.frequency.value= Number(slider3.value);
        document.querySelector("FiltSpeed1").textContent = slider3.value;

});

// Delay time slider
document.getElementById('time2').addEventListener('input', function (e) {
  delay2.delayTime.setTargetAtTime(e.target.value / 1000, ctx.currentTime, 0.05);
});

// Feedback slider.
document.getElementById('fb2').addEventListener('input', function (e) {
  feedback2.gain.setTargetAtTime(e.target.value / 100, ctx.currentTime, 0.02);
});

osc2.start();
mod.start();
filterMod.start();

osc2.stop(t+dur2*2.1);
mod.stop(t+dur2*2.1);
filterMod.stop(t+dur2*2.1);

}

const midiPitches2 = [45, 37, 84, 30, 79, 120];

        // 2. Create the random picker function
        const randomPitch2 = function() {
            let randomMidiNote2 = midiPitches2[Math.floor(Math.random() * midiPitches2.length)];
            
            let newFreq = 440 * 2 ** ((randomMidiNote2 - 69) / 12);

            return newFreq;
        }

</script>

</body>
</html>
